# Rime schema settings
# encoding: utf-8

schema:
  schema_id: flypy_cangjie5
  name: 雙拼逆倉
  version: "1.0"
  author:
    - 发明人 - bgzhao66 at github
  description: |
    編碼規則：
     - **主碼**：採用小鶴雙拼，每字兩碼，逐字拼接。
     - **輔助碼**：發生編碼衝突時，按「末字尾碼 → 首字首碼 → 次字首碼」的順序追加倉頡五代編碼；單字按「尾碼 → 首碼 → 次碼」取碼。
     - **長詞編碼**：四字及以上詞條不追加倉頡輔助碼；發生編碼衝突時，直接追加未使用的字母序號，直至取得唯一編碼。
     - **簡碼**：僅一至三字詞設簡碼，長度比主碼少一碼，按詞頻分配，避免編碼衝突。
     - **詞頻分配**：按詞頻由高到低分配編碼，高頻詞優先使用較短編碼。
     - **顯示方式**：支援雙拼輸入、全拼顯示。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: extended_charset
    states: [ 常用, 增廣 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;"
  #max_code_length: 5  # 五碼頂字上屏

translator:
  dictionary: flypy_cangjie5
  enable_charset_filter: true
  enable_sentence: true
  enable_encoder: true
  encode_commit_history: true
  enable_user_dict: true
  max_phrase_length: 10

#abc_segmentor:
#  extra_tags:
#    - reverse_lookup  # 與拼音（反查碼）混打

reverse_lookup:
  dictionary: luna_pinyin
  prefix: "`"
  suffix: "'"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

simplifier:
  tips: all  # 簡化字模式下提示對應的傳統漢字

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    reverse_lookup: "`[a-z]*'?$|[a-z]+'$"

style:
  horizontal: true
  inline_preedit: true

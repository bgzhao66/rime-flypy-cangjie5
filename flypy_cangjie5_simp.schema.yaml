# Rime schema settings
# encoding: utf-8

schema:
  schema_id: flypy_cangjie5_simp
  name: 双拼逆仓
  version: "1.0"
  author:
    - 发明人 - bgzhao66 at github
  description: |
    编码规则：
    - **主码**：采用小鹤双拼，每字两码，逐字拼接。
    - **辅助码**：发生编码冲突时，按「末字尾码 → 首字首码 → 次字首码」的顺序追加仓颉五代编码；单字按「尾码 → 首码 → 次码」取码。
    - **长词编码**：四字及以上词条不追加仓颉辅助码；发生编码冲突时，直接追加未使用的字母序号，直至获得唯一编码。
    - **简码**：仅一至三字词设简码，长度比主码少一码，按词频分配，避免编码冲突。
    - **词频分配**：按词频由高到低分配编码，高频词优先使用较短编码。
    - **显示方式**：支持双拼输入、全拼显示。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: extended_charset
    states: [ 常用, 增广 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;"
  #max_code_length: 5  # 五码顶字上屏

translator:
  dictionary: flypy_cangjie5_simp
  enable_charset_filter: true
  enable_sentence: true
  enable_encoder: true
  encode_commit_history: true
  enable_user_dict: true
  max_phrase_length: 10

#abc_segmentor:
#  extra_tags:
#    - reverse_lookup  # 与拼音（反查码）混打

reverse_lookup:
  dictionary: luna_pinyin
  prefix: "`"
  suffix: "'"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

simplifier:
  tips: all  # 简化字模式下提示对应的传统汉字

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    reverse_lookup: "`[a-z]*'?$|[a-z]+'$"

style:
  horizontal: true
  inline_preedit: true
